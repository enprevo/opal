name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open folder …
        2. Press …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Opal version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This bug could lose or corrupt files
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Ctrl+Shift+F12 opens the developer tools console.
