name: CI

env:
  # Opal runs its AI models on the CPU: don't download the CUDA libraries for GPUs (~230 MB on Linux x64).
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests (Ubuntu, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: End-to-end tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/

  # Installers are built on native runners for every OS/CPU pair so that the native AI runtime
  # (onnxruntime-node) and image library (sharp) match the target machine.
  draft:
    name: Create draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Created once, before the parallel builds, so every installer is attached to the same release.
      - name: Create the draft release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, "## [") == 1 { if (found) exit; if (index($0, head) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Opal $version" --notes-file notes.md

  release:
    name: Release (${{ matrix.name }})
    needs: draft
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: --win --x64 }
          - { name: windows-arm64, os: windows-11-arm, args: --win --arm64 }
          - { name: macos-arm64, os: macos-latest, args: --mac --arm64 }
          - { name: macos-x64, os: macos-15-intel, args: --mac --x64 }
          - { name: linux-x64, os: ubuntu-24.04, args: --linux --x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, args: --linux --arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - name: Build installers and attach them to a draft GitHub release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
